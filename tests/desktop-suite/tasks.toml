# Luna desktop suite (moonshot section 10, exit at M6). 100 tasks in 19 areas.
# Each [[task]] has id, area, title, steps, expected, needs and automation.
# Auto tasks also have actions (run in order) and checks (must all hold after the actions).
# Action verbs: spawn, workspace, window, layout, output, ipc, notify, clip-set, screenshot, sleep, wait.
# Check form: QUERY OP VALUE, with OP one of == != >= <= > < contains. Quote values with quotes if needed.
# needs values: nested-hyprland, real-hw (a real laptop or desktop), vm (VM matrix), rig-devices (devices named in opal/rig/devices).

# ---------- windows (12) ----------

[[task]]
id = "win-tile-three"
area = "windows"
title = "Three windows tile on space 2 with focus on the newest"
steps = ["Switch to space 2.", "Open three kitty windows titled suite-1, suite-2 and suite-3."]
expected = ["Layout is dwindle.", "All three windows are tiled and inside the output.", "suite-3 is the active window."]
needs = ["nested-hyprland"]
automation = "auto"
actions = [
  "workspace 2",
  "spawn kitty --title suite-1",
  "wait 10 clients.count[ws=2] == 1",
  "spawn kitty --title suite-2",
  "wait 10 clients.count[ws=2] == 2",
  "spawn kitty --title suite-3",
  "wait 10 clients.count[ws=2] == 3",
]
checks = [
  'layout == dwindle',
  'clients.count[ws=2,floating=false] == 3',
  'clients.outside[ws=2] == 0',
  'active.title == suite-3',
  'window[title=suite-1].workspace == 2',
]

