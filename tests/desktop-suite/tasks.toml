expected = ["It floats after the first toggle.", "It tiles again after the second toggle."]
needs = ["nested-hyprland"]
automation = "auto"
actions = [
  "workspace 1",
  "spawn kitty --title suite-f",
  "wait 10 window[title=suite-f].floating == false",
  "window title=suite-f float on",
  "wait 5 window[title=suite-f].floating == true",
  "window title=suite-f float toggle",
]
checks = ["window[title=suite-f].floating == false"]

