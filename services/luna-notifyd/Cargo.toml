[package]
name = "luna-notifyd"
version = "0.1.0"
edition = "2021"
publish = false
description = "lunaOS notification service: freedesktop notifications and live activities over a typed socket"

[dependencies]
zbus = "5"
async-io = "2"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
