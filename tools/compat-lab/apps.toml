# Compat Lab app list (moonshot 13.1). One [[app]] table per app.
#
# source:        fdroid            hash is read from the F-Droid index at fetch time
#                apk-url           sha256 is pinned here and checked on every fetch and run
#                play-placeholder  listed only; not fetched or run yet
# abi:           x86_64-capable    x86_64 native code or pure Java
#                arm-only          needs the phone lane; skipped on the x86_64 lane
# test_account:  a placeholder name only; this file holds no credentials
# smoke:         launch, settle:SECONDS, monkey:EVENTS (a fixed seed is used)
#                "launch" is added first when it is missing.
#
# Example of a pinned entry (not active):
# [[app]]
# package = "org.example.app"
# name = "Example"
# source = "apk-url"
# url = "https://example.org/app-1.0.apk"
# sha256 = "<64 hex characters>"
# abi = "x86_64-capable"
# category = "other"
# test_account = "none"
# smoke = ["launch", "settle:8"]

schema = 1

# browser

[[app]]
package = "org.mozilla.fennec_fdroid"
name = "Fennec F-Droid Browser"
source = "fdroid"
abi = "x86_64-capable"
category = "browser"
test_account = "none"
smoke = ["launch", "settle:10", "monkey:200"]

