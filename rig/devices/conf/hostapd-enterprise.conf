# Rig AP: WPA2-Enterprise (802.1X). PEAP and TTLS are chosen by the client. Rendered by wifi-hwsim.sh.
interface=@IFACE@
driver=nl80211
ssid=luna-rig-ent
country_code=US
hw_mode=g
channel=11
wpa=2
wpa_key_mgmt=WPA-EAP
rsn_pairwise=CCMP
ieee8021x=1
auth_server_addr=127.0.0.1
auth_server_port=11812
auth_server_shared_secret=rig-radius-secret
