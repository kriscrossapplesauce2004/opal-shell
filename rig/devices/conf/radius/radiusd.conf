# Minimal FreeRADIUS 3.x config for the rig 802.1X stand-in (PEAP and TTLS).
# Written for devices/wifi-hwsim.sh. Check with: radiusd -C -d <directory>
run_dir = ${confdir}/run

log {
	destination = files
	file = ${confdir}/radius.log
}

listen {
	type = auth
	ipaddr = 127.0.0.1
	port = 11812
}

client rig-hostapd {
	ipaddr = 127.0.0.1
	secret = rig-radius-secret
	shortname = rig-hostapd
}

modules {
	files {
		usersfile = ${confdir}/users
	}
	pap {
	}
	chap {
	}
	mschap {
	}
	eap {
		default_eap_type = peap
		timer_expire = 60
		tls-config tls-common {
			private_key_file = ${confdir}/certs/server.key
			certificate_file = ${confdir}/certs/server.pem
			ca_file = ${confdir}/certs/server.pem
			tls_min_version = "1.2"
			tls_max_version = "1.2"
		}
		peap {
			tls = tls-common
			default_eap_type = mschapv2
			copy_request_to_tunnel = no
			use_tunneled_reply = no
		}
		ttls {
			tls = tls-common
			default_eap_type = md5
			copy_request_to_tunnel = no
			use_tunneled_reply = no
		}
	}
}

authorize {
	eap {
		ok = return
	}
	files
	mschap
	pap
}

authenticate {
	Auth-Type PAP {
		pap
	}
	Auth-Type CHAP {
		chap
	}
	Auth-Type MS-CHAP {
		mschap
	}
	eap
}
